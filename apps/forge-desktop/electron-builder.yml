appId: com.forge.desktop
productName: Forge
copyright: Copyright © 2024 Forge

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: assets/icons
    to: icons

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icons/icon.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico

publish: null
